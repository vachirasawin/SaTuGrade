name: Keep Render Services Awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping SM model API
        run: curl -sf https://sm-model-api.onrender.com/ || echo "SM ping failed"

      - name: Ping AL model API
        run: curl -sf https://al-model-api.onrender.com/ || echo "AL ping failed"

      - name: Ping AC model API
        run: curl -sf https://ac-model-api.onrender.com/ || echo "AC ping failed"